<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>화재 감지기 교체 관리 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
    body { margin: 20px; background-color: #f0f4f8; color: #2d3748; }
    h1 { font-size: 1.35rem; color: #1a365d; display: flex; align-items: center; gap: 8px; }
    .status-online { display: inline-block; width: 10px; height: 10px; background: #38a169; border-radius: 50%; }
    .container { display: grid; grid-template-columns: 1.1fr 1.3fr; gap: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    input, select, button { padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 0.9rem; }
    button { background-color: #3182ce; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #2b6cb0; }
    button.excel-btn { background-color: #2f855a; float: right; }
    button.excel-btn:hover { background-color: #276749; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; }
    th { background-color: #edf2f7; color: #4a5568; }
    .checkbox-group { display: flex; flex-direction: column; gap: 4px; text-align: left; font-size: 0.8rem; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; background: #feebc8; color: #c05621; font-weight: bold; }
  </style>
</head>
<body>

  <h1><span class="status-online"></span> 🚨 비화재보 감지기 교체 및 이력관리 (실시간 공유)</h1>

  <div class="card" style="margin-bottom: 20px;">
    <strong>1. 오작동 발생 접수</strong>
    <div class="form-group">
      <label>발생일시: <input type="datetime-local" id="eventTime"></label>
      <label>동: <input type="number" id="dong" placeholder="202" style="width: 75px;"></label>
      <label>계단: 
        <select id="stair">
          <option value="1">1계단 (1~4호)</option>
          <option value="2">2계단 (5~8호)</option>
        </select>
      </label>
      <label>층: <input type="number" id="floor" placeholder="23" style="width: 65px;"></label>
      <button onclick="registerBatch()">교체 대상 4세대 추가</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>2. 미교체/작업 대기 목록</strong>
        <span id="pendingCount" class="badge">대기 0건</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>발생일시</th>
            <th>세대</th>
            <th>조치사항 및 완료</th>
          </tr>
        </thead>
        <tbody id="pendingList"></tbody>
      </table>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>3. 조치 완료 이력 대장</strong>
        <button class="excel-btn" onclick="exportToExcel()">📊 엑셀 다운로드</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>발생일시</th>
            <th>발생장소</th>
            <th>처리일자</th>
            <th>조치내용</th>
          </tr>
        </thead>
        <tbody id="historyList"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 본인의 Firebase Realtime Database URL로 변경 (끝에 슬래시 제외)
    const DB_URL = "https://fire-detector-12345-default-rtdb.firebaseio.com";

    document.getElementById('eventTime').value = new Date().toISOString().slice(0, 16);

    let pendingData = {};
    let historyData = {};

    async function loadData() {
      if (DB_URL.includes("https://fire-detector-12345-default-rtdb.firebaseio.com")) return;
      try {
        const [resPending, resHistory] = await Promise.all([
          fetch(`${DB_URL}/pending.json`),
          fetch(`${DB_URL}/history.json`)
        ]);
        pendingData = (await resPending.json()) || {};
        historyData = (await resHistory.json()) || {};
        render();
      } catch (e) {
        console.error("데이터 로드 실패:", e);
      }
    }

    async function registerBatch() {
      const time = document.getElementById('eventTime').value;
      const dong = document.getElementById('dong').value;
      const stair = document.getElementById('stair').value;
      const floor = document.getElementById('floor').value;

      if (!time || !dong || !floor) {
        alert('발생일시, 동, 층수를 입력해주세요.');
        return;
      }

      const start = stair === "1" ? 1 : 5;
      const end = stair === "1" ? 4 : 8;

      for (let i = start; i <= end; i++) {
        const unit = `${dong}동 ${floor}${String(i).padStart(2, '0')}호`;
        await fetch(`${DB_URL}/pending.json`, {
          method: 'POST',
          body: JSON.stringify({
            eventTime: time.replace('T', ' '),
            location: unit
          })
        });
      }
      loadData();
    }

    async function completeTask(key) {
      const row = document.getElementById(`row-${key}`);
      const checkedBoxes = row.querySelectorAll('input[type="checkbox"]:checked');
      if (checkedBoxes.length === 0) {
        alert('조치사항을 1개 이상 선택하세요.');
        return;
      }

      const actions = Array.from(checkedBoxes).map(cb => cb.value).join(', ');
      const target = pendingData[key];
      const today = new Date().toISOString().slice(0, 10);

      // 이력에 추가
      await fetch(`${DB_URL}/history.json`, {
        method: 'POST',
        body: JSON.stringify({
          eventTime: target.eventTime,
          location: target.location,
          processDate: today,
          actions: actions
        })
      });

      // 대기목록에서 삭제
      await fetch(`${DB_URL}/pending/${key}.json`, { method: 'DELETE' });
      loadData();
    }

    function render() {
      const pList = document.getElementById('pendingList');
      const hList = document.getElementById('historyList');
      const pKeys = Object.keys(pendingData);
      const hKeys = Object.keys(historyData);

      document.getElementById('pendingCount').innerText = `대기 ${pKeys.length}건`;

      pList.innerHTML = pKeys.map(k => `
        <tr id="row-${k}">
          <td>${pendingData[k].eventTime}</td>
          <td><strong>${pendingData[k].location}</strong></td>
          <td>
            <div class="checkbox-group">
              <label><input type="checkbox" value="감지기 전체 교체"> 전체 교체</label>
              <label><input type="checkbox" value="침실1 교체"> 침실1 차동식</label>
              <label><input type="checkbox" value="침실2 교체"> 침실2 차동식</label>
              <label><input type="checkbox" value="주방 교체"> 주방 정온식</label>
              <label><input type="checkbox" value="점검후 교체불필요"> 교체 불필요</label>
            </div>
            <button style="margin-top:5px; width:100%;" onclick="completeTask('${k}')">처리 완료</button>
          </td>
        </tr>
      `).join('');

      const sortedHistory = hKeys.map(k => historyData[k]).sort((a, b) => new Date(a.eventTime) - new Date(b.eventTime));
      hList.innerHTML = sortedHistory.map(h => `
        <tr>
          <td>${h.eventTime}</td>
          <td>${h.location}</td>
          <td>${h.processDate}</td>
          <td style="text-align:left;">${h.actions}</td>
        </tr>
      `).join('');
    }

    function exportToExcel() {
      const sorted = Object.values(historyData).sort((a, b) => new Date(a.eventTime) - new Date(b.eventTime));
      if (sorted.length === 0) {
        alert('출력할 이력 데이터가 없습니다.');
        return;
      }
      const data = sorted.map(item => ({
        "발생일시": item.eventTime,
        "발생장소": item.location,
        "조치사항": item.actions,
        "처리일자": item.processDate
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "이력관리대장");
      XLSX.writeFile(wb, `화재_이력대장_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // 4초마다 실시간 자동 갱신
    setInterval(loadData, 4000);
    loadData();
  </script>
</body>
</html>
